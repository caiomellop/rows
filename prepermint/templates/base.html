<!doctype html>
<html lang="en" data-theme="light" class="h-full antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prepermint{% endblock %}</title>
  <meta name="description" content="{% block description %}Portfolio builder with GitHub sync{% endblock %}">
  {% block robots %}{% endblock %}
  <link rel="icon" href="{{ static_url('favicon.ico') }}">
  {# Applies the saved theme before the first paint, so there is no flash. The key matches THEME_KEY in static/app.js. #}
  <script>(function(){try{var t=localStorage.getItem("rows-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
  <link rel="preload" href="/static/fonts/Figtree-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/EBGaramond-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
  <script src="{{ static_url('app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col">
  {% block body %}{% endblock %}
</body>
</html>
