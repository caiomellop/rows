# Alembic migrations for the Python app (docs/adr/0003). The URL comes from DATABASE_URL (see migrations/env.py).
# The first revision is a baseline equal to Drizzle migration 0005: on a database Drizzle already migrated,
# run `uv run alembic stamp 0001_baseline` once instead of `upgrade`.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
